name: Build iOS (Unsigned)

# 手动触发，打出未签名 IPA，下载后发给全能签商家签名
on:
  workflow_dispatch:

jobs:
  build-ios:
    # 用 macos-14（Xcode 15）而非 macos-latest（Xcode 16），Capacitor 6.2.x 官方仅支持到 Xcode 15
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ============ 选定 Xcode 15（避免 16 的 Swift 6 编译器报错）============
      - name: Select Xcode 15
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============ 安装依赖（统一用 legacy-peer-deps 避免 webpack 冲突）============
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ============ 构建 H5 ============
      - name: Build H5
        run: npm run build:h5

      - name: Verify dist directory
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "❌ dist/ 目录不存在或为空，build:h5 失败"
            exit 1
          fi
          echo "✅ dist/ 目录存在"
          ls -la dist/ | head -10

      # ============ 安装 Capacitor iOS（版本对齐 core@6）============
      - name: Install Capacitor iOS
        run: npm install @capacitor/ios@^6.2.1 --legacy-peer-deps

      # ============ 添加 iOS 平台（已存在则 copy）============
      - name: Add iOS platform
        run: |
          if [ -d "ios/App" ]; then
            echo "ios/ 目录已存在，执行 cap copy"
            npx cap copy ios
          else
            echo "ios/ 目录不存在，执行 cap add"
            npx cap add ios
          fi

      # ============ Sync iOS（必须先 sync，否则 Podfile 不存在）============
      - name: Sync iOS
        run: npx cap sync ios

      # ============ 配置 Info.plist（通讯录权限 + ATS 明文 HTTP）============
      - name: Configure Info.plist (通讯录权限 + ATS)
        run: |
          PLIST=ios/App/App/Info.plist
          if [ ! -f "$PLIST" ]; then
            echo "❌ Info.plist 不存在: $PLIST"
            find ios -name "Info.plist" -type f
            exit 1
          fi
          echo "=== Info.plist 路径: $PLIST ==="

          # --- 通讯录权限 ---
          /usr/libexec/PlistBuddy -c "Delete :NSContactsUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSContactsUsageDescription string 需要访问通讯录以发现已注册的好友并邀请一起游戏" "$PLIST"
          echo "✅ 通讯录权限已配置"

          # --- ATS 明文 HTTP 例外（当前用服务器公网 IP + HTTP，iOS 默认禁止）---
          # 删除旧值（忽略错误）
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          # 添加 NSAllowsArbitraryLoads = true（允许所有 HTTP 明文请求）
          # 将来买了域名 + SSL 后，改为具体域名例外更安全：
          #   /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:yourdomain.com:NSIncludesSubdomains bool true" "$PLIST"
          #   /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSExceptionDomains:yourdomain.com:NSThirdPartyExceptionAllowsInsecureHTTPLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          echo "✅ ATS 已配置（NSAllowsArbitraryLoads = true）"

          # --- App 显示名称 ---
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Draw Together" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleName" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string Draw Together" "$PLIST"
          echo "✅ App 名称已设置为 Draw Together"

          echo "=== 验证 Info.plist 关键配置 ==="
          /usr/libexec/PlistBuddy -c "Print :NSContactsUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"

      # ============ 安装 CocoaPods 依赖（Contacts 插件需要）============
      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          if [ ! -f "Podfile" ]; then
            echo "❌ Podfile 不存在，cap sync 可能失败"
            exit 1
          fi
          echo "=== Podfile 内容 ==="
          cat Podfile

          # macOS runner 自带 cocoapods，直接用
          pod --version
          # 第一次可能要更新 spec repo，失败则重试一次
          pod install || pod install

      # ============ 编译（不签名）============
      - name: Build without signing
        run: |
          cd ios/App
          # 列出可用 scheme（确认存在）
          echo "=== 可用 Schemes ==="
          xcodebuild -workspace App.xcworkspace -list

          # Capacitor 项目 scheme 固定为 "App"，不动态解析（避免 grep 把标题当 scheme）
          echo "=== 使用 Scheme: App ==="

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # ============ 手动打包成未签名 IPA ============
      - name: Package unsigned IPA
        run: |
          # 查找 .app 路径（兼容不同 Xcode 版本输出路径）
          APP_PATH=$(find ios/App/build/Build/Products -name "App.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 找不到 App.app"
            find ios/App/build -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          echo "=== 找到 .app: $APP_PATH ==="
          ls -la "$APP_PATH"

          # 清理旧产物
          rm -rf Payload drawtogether-unsigned.ipa

          # 用 ditto 复制（macOS 原生，保留符号链接和权限）
          mkdir Payload
          ditto "$APP_PATH" Payload/App.app

          # 压缩成 IPA（-X 不保留 uid/gid，-r 递归；不用 -y，IPA 标准不允许符号链接）
          zip -r -X drawtogether-unsigned.ipa Payload
          echo "=== IPA 文件信息 ==="
          ls -la drawtogether-unsigned.ipa
          echo "=== IPA 内容预览 ==="
          unzip -l drawtogether-unsigned.ipa | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: drawtogether-unsigned-ios
          path: drawtogether-unsigned.ipa
          retention-days: 30

      # ============ 失败时上传构建日志便于排查 ============
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/App/build
            /Users/runner/Library/Logs/CocoaPods
          retention-days: 7
